<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin login | WMHQ CEO Checklist Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efe7dc; --surface: #fff; --ink: #3a1416; --muted: #7a5a5c; --line: #ead6da;
  --soft: #e5c9cf; --blush: #ecc5ce; --accent: #6f86a8; --highlight: #fbe7a1; --danger: #a3323a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; -webkit-font-smoothing: antialiased; }
.title { color: var(--ink); font-family: 'VT323', ui-monospace, monospace; font-size: clamp(34px, 7vw, 56px); line-height: .95; text-align: center; letter-spacing: .04em; margin-bottom: 24px; }
.card { width: 100%; max-width: 480px; background: var(--surface); border: 2px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--soft); padding: 32px; }
.eyebrow { font-family: 'VT323', monospace; font-size: 20px; color: var(--accent); letter-spacing: .04em; }
h1 { font-size: 26px; font-weight: 800; margin: 2px 0 8px; }
p { font-size: 15px; line-height: 1.6; color: var(--muted); }
.important { margin-top: 16px; background: var(--highlight); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label { display: block; font-size: 14px; font-weight: 700; margin: 18px 0 6px; }
input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; color: var(--ink); background: #fff; }
input:focus { outline: none; border-color: var(--accent); }
button { width: 100%; margin-top: 22px; font: inherit; font-size: 15px; font-weight: 700; color: #fff; background: var(--ink); border: 0; border-radius: 999px; padding: 14px; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .6; cursor: default; }
.notice { font-size: 14px; padding: 10px 12px; border-radius: 10px; margin-top: 16px; background: #fbeeee; color: var(--danger); }
.small { font-size: 14px; margin-top: 18px; }
.link-btn { background: none; color: var(--ink); width: auto; padding: 0; margin: 0; font-size: 14px; text-decoration: underline; }
footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: var(--muted); }
@media (max-width: 420px) { .row { grid-template-columns: 1fr; gap: 0; } .card { padding: 24px; } }
</style>
</head>
<body>
<p class="title" aria-hidden="true">THE WMHQ CEO<br>CHECKLIST CHALLENGE</p>
<main class="card">
  <p class="eyebrow">ADMIN</p>
  <h1>Admin login</h1>
  <p>For managing who can access the challenge.</p>
  <form id="admin-form" novalidate>
    <label for="email">Admin email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="notice" id="error" role="alert" hidden></div>
    <button type="submit" id="submit">Log in</button>
  </form>
  <p class="small"><a href="/login/" style="color:var(--ink)">Member login</a></p>
</main>
<script>
(function () {
  var f = function (id) { return document.getElementById(id); };
  f('admin-form').addEventListener('submit', function (e) {
    e.preventDefault();
    f('error').hidden = true;
    f('submit').disabled = true; f('submit').textContent = 'Checking…';
    fetch('/api/admin-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: f('email').value.trim(), password: f('password').value })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (b) {
        if (!res.ok || !b.ok) throw new Error(b.error || 'Something went wrong. Please try again.');
        location.href = '/admin/';
      });
    }).catch(function (err) {
      f('error').textContent = err.message; f('error').hidden = false;
      f('submit').disabled = false; f('submit').textContent = 'Log in';
    });
  });
})();
</script>
</body>
</html>
